name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kryptos_test
          POSTGRES_USER: kryptos
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Unit Tests
        working-directory: backend
        run: mvn verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kryptos_test
          DB_USERNAME: kryptos
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 3600000
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}

      - name: Upload Target Folder
        uses: actions/upload-artifact@v4
        with:
          name: maven-target-folder
          path: backend/target/
          retention-days: 1    

      - name: Upload SBOM (Software Bill of Materials)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: warn
  sast:
    name: SAST (SpotBugs + Find Security Bugs + SonarCloud)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Target Folder
        uses: actions/download-artifact@v4
        with:
          name: maven-target-folder
          path: backend/target/

      - name: Run SpotBugs
        working-directory: backend
        run: mvn spotbugs:check -DskipTests
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugs*.xml

      - name: Run SonarCloud Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: backend
        run: >-
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=mei-desofs-kryptos
          -Dsonar.organization=mei-desofs-kryptos
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -DskipTests

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload SonarCloud Task Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-report
          path: backend/target/sonar/report-task.txt

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Dependency-Check
        working-directory: backend
        run: mvn dependency-check:check -DskipTests
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check*
          if-no-files-found: warn

  dast:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    permissions:
      contents: read

    env:
      DB_USERNAME: kryptos
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: 3600000
      ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start application stack
        working-directory: backend
        run: |
          set -e
          sh scripts/generate-certs.sh
          docker compose up -d --build
          echo "Waiting for backend to become responsive on :443 ..."
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/api/auth/login || echo "000")
            case "$code" in
              000|502|503|504)
                echo "Attempt $i: backend not ready yet (HTTP $code)"
                sleep 5
                ;;
              *)
                echo "Backend ready: HTTP $code on /api/auth/login"
                ready=1
                break
                ;;
            esac
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Backend did not become ready within 5 minutes"
            docker compose logs --no-color app | tail -200
            docker compose logs --no-color db | tail -50
            exit 1
          fi

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://localhost'
          rules_file_name: '.zap/rules.tsv'
          # -a alpha rules, -j AJAX spider, -m 5 spider cap, -T 10 total cap.
          cmd_options: '-a -j -m 5 -T 10'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-scan-internal

      - name: Collect application logs
        if: always()
        working-directory: backend
        run: |
          mkdir -p ../dast-logs
          docker compose logs --no-color app > ../dast-logs/app.log 2>&1 || true
          docker compose logs --no-color db  > ../dast-logs/db.log  2>&1 || true

      - name: Stop application stack
        if: always()
        working-directory: backend
        run: docker compose down -v

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn

      - name: Upload application logs from DAST run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-app-logs
          path: dast-logs/
          if-no-files-found: warn
