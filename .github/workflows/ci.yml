name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kryptos_test
          POSTGRES_USER: kryptos
          POSTGRES_PASSWORD: kryptos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Unit Tests
        working-directory: backend
        run: mvn verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kryptos_test
          DB_USERNAME: kryptos
          DB_PASSWORD: kryptos
          JWT_SECRET: ci-test-secret-minimum-256-bits-long-key
          JWT_EXPIRATION: 3600000

  sast:
    name: SAST (SpotBugs + Find Security Bugs)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs
        working-directory: backend
        run: mvn compile spotbugs:check -DskipTests
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugs*.xml

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Dependency-Check
        working-directory: backend
        run: mvn dependency-check:check -DskipTests
        continue-on-error: true

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
