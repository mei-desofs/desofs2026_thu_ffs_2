spring.application.name=kryptos

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kryptos}
spring.datasource.username=${DB_USERNAME:kryptos}
spring.datasource.password=${DB_PASSWORD:kryptos}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:changeme-use-a-strong-secret-in-production}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Encryption
kryptos.encryption.secret=${ENCRYPTION_SECRET:}

# File handling (import/export)
kryptos.storage.temp-dir=${TEMP_DIR:/tmp/kryptos}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.kryptos=INFO
logging.level.org.springframework.security=WARN
