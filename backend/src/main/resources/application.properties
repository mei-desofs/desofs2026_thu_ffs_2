spring.application.name=kryptos

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kryptos}
spring.datasource.username=${DB_USERNAME:kryptos}
spring.datasource.password=${DB_PASSWORD:kryptos}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:changeme-use-a-strong-secret-in-production}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Encryption
kryptos.encryption.secret=${ENCRYPTION_SECRET:}

# File handling (import/export)
kryptos.storage.temp-dir=${TEMP_DIR:/tmp/kryptos}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:ef6ef5e6862a2d}
spring.mail.password=${MAIL_PASSWORD:8ef4aac9ca0043}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.kryptos=INFO
logging.level.org.springframework.security=WARN

# Log forwarding to external SIEM/logging service (V16.4.3)
# Example: kryptos.logging.forwarding.url=https://logs.example.com/api/logs
kryptos.logging.forwarding.url=${LOG_FORWARDING_URL:}

# Async task executor configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
