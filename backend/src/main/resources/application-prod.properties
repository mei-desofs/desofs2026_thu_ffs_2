# ============================================================
# Kryptos — Production Profile
# ASVS V13.4.2: Debug modes disabled in production
# ============================================================

# JPA — no SQL logging, validate-only (no auto DDL)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Error handling — never expose stack traces
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Disable Spring DevTools (should not be on classpath, but belt-and-suspenders)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logging — production levels
logging.level.root=WARN
logging.level.com.kryptos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Swagger/OpenAPI — disabled in production (V13.4.5)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Server — suppress version info (V13.4.6)
server.server-header=
server.error.whitelabel.enabled=false
